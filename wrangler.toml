name = "project-helper"
main = "src/index.js"
compatibility_date = "2026-10-13"

# Each pair links an external channel, where `@LUMA track` is used, to the
# channel its tasks are posted to. `name` is the pair's tab in the Google Sheet. Slack channel IDs are
# at the bottom of the channel's View channel details → About tab. Invite LUMA
# to every channel.
#
# Add `incidents = "C…"` to a pair to turn on `/luma incident` in its external
# channel; its incidents are tracked in that channel.
[vars]
CHANNEL_PAIRS = [
  { name = "aura300", external = "C0C178XHSQH", tasks = "C0C143QFZL3", incidents = "C0C8HJUJYK0" }, # #aura300-external → #aura300-dev, #aura300-incidents
  { name = "test", external = "C0CBTBK0ZAN", tasks = "C0CBTBKK610", incidents = "C0CBW4KGSF3" }, # #text-external → #test-dev, #test-incidents
]
# Time zone for the times written to the Google Sheet.
TIMEZONE = "Asia/Colombo"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
